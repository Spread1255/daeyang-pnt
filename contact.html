<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>견적 문의 | 대양피엔티㈜</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">대양피엔티㈜<span>DAEYANG P&amp;T</span></a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">메뉴</button>
    <nav id="site-nav" class="site-nav">
      <a href="index.html">홈</a>
      <a href="products.html">제품</a>
      <a href="shop.html">구매</a>
      <a href="colors.html">색상표</a>
      <a href="applications.html">적용 분야</a>
      <a href="about.html">회사소개</a>
      <a class="nav-cta" href="contact.html" aria-current="page">견적 문의</a>
    </nav>
  </header>

  <main>
    <section class="page-hero">
      <p class="eyebrow">Contact</p>
      <h1>견적 문의</h1>
    </section>

    <section class="section contact-grid">
      <form id="inquiry-form" class="inquiry">
        <label>회사명
          <input name="company" type="text" required autocomplete="organization">
        </label>
        <label>담당자
          <input name="name" type="text" required autocomplete="name">
        </label>
        <label>이메일
          <input name="email" type="email" required autocomplete="email">
        </label>
        <label>관심 제품
          <select name="product">
            <option>용도형 — DY#1 내장형</option>
            <option>용도형 — DY#2 외장형</option>
            <option>스트럭쳐 — DY#3</option>
            <option>특수 마감 — DY#4 텍스쳐</option>
            <option>특수 마감 — DY#5 메탈릭</option>
            <option>특수 마감 — DY#6 함마톤</option>
            <option>아직 모름 / 추천 요청</option>
          </select>
        </label>
        <label>문의 내용
          <textarea name="message" rows="6" required placeholder="적용 제품, 색상(RAL), 월 소요량, 라인 온도 등"></textarea>
        </label>
        <button class="btn" type="submit">문의 보내기</button>
        <p id="form-status" class="form-status" role="status"></p>
      </form>
      <aside class="card">
        <h2>연락처</h2>
        <p>TEL 031)987-8587<br>FAX 031)982-8587</p>
        <p>경기도 김포시 하성면 애기봉로 774번길 39-17,22<br>(하성면 원산리 185-14,15)</p>
      </aside>
    </section>
  </main>

  <footer class="site-footer">
    <p><strong>대양피엔티㈜</strong> · 분체도료</p>
    <p>경기도 김포시 하성면 애기봉로 774번길 39-17,22 · TEL 031)987-8587 · FAX 031)982-8587</p>
    <p class="fine">본 사이트는 포트폴리오용 가상 회사 예시입니다. 문의는 이 브라우저에만 저장됩니다.</p>
  </footer>
  <script src="js/main.js"></script>
</body>
</html>

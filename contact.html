<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="meta.contact.title">견적 문의 | 대양피엔티㈜</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html"><img class="logo-mark" src="images/logo-dyp.png" alt="DAEYANG P&amp;T"><span>DAEYANG P&amp;T</span></a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" data-i18n="common.menu">메뉴</button>
    <nav id="site-nav" class="site-nav">
      <a href="index.html" data-i18n="nav.home">홈</a>
      <a href="products.html" data-i18n="nav.products">제품</a>
      <a href="shop.html" data-i18n="nav.buy">구매</a>
      <a href="colors.html" data-i18n="nav.colors">색상표</a>
      <a href="applications.html" data-i18n="nav.applications">적용 분야</a>
      <a href="about.html" data-i18n="nav.about">회사소개</a>
      <a class="nav-cta" href="contact.html" aria-current="page" data-i18n="nav.contact">견적 문의</a>
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-lang="ko">KO</button>
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="ja">JA</button>
        <button type="button" data-lang="zh">CN</button>
      </div>
    </nav>
  </header>

  <main>
    <section class="page-hero">
      <p class="eyebrow">Contact</p>
      <h1 data-i18n="contact.h1">견적 문의</h1>
    </section>

    <section class="section contact-grid">
      <form id="inquiry-form" class="inquiry">
        <label><span data-i18n="contact.form.company">회사명</span>
          <input name="company" type="text" required autocomplete="organization">
        </label>
        <label><span data-i18n="contact.form.contact">담당자</span>
          <input name="name" type="text" required autocomplete="name">
        </label>
        <label><span data-i18n="contact.form.email">이메일</span>
          <input name="email" type="email" required autocomplete="email">
        </label>
        <label><span data-i18n="contact.form.product">관심 제품</span>
          <select name="product">
            <option data-i18n="contact.product.opt1">용도형 — DY#1 내장형</option>
            <option data-i18n="contact.product.opt2">용도형 — DY#2 외장형</option>
            <option data-i18n="contact.product.opt3">스트럭쳐 — DY#3</option>
            <option data-i18n="contact.product.opt4">특수 마감 — DY#4 텍스쳐</option>
            <option data-i18n="contact.product.opt5">특수 마감 — DY#5 메탈릭</option>
            <option data-i18n="contact.product.opt6">특수 마감 — DY#6 함마톤</option>
            <option data-i18n="contact.product.opt7">아직 모름 / 추천 요청</option>
          </select>
        </label>
        <label><span data-i18n="contact.form.message">문의 내용</span>
          <textarea name="message" rows="6" required data-i18n-placeholder="contact.form.messagePlaceholder" placeholder="적용 제품, 색상(RAL), 월 소요량, 라인 온도 등"></textarea>
        </label>
        <button class="btn" type="submit" data-i18n="contact.form.submit">문의 보내기</button>
        <p id="form-status" class="form-status" role="status"></p>
      </form>
      <aside class="card">
        <h2 data-i18n="contact.aside.h2">연락처</h2>
        <p>TEL 031)987-8587<br>FAX 031)982-8587</p>
        <p>경기도 김포시 하성면 애기봉로 774번길 39-17,22<br>(하성면 원산리 185-14,15)</p>
      </aside>
    </section>
  </main>

  <footer class="site-footer">
    <p><strong>대양피엔티㈜</strong> · <span data-i18n="footer.tagline">분체도료</span></p>
    <p>경기도 김포시 하성면 애기봉로 774번길 39-17,22 · TEL 031)987-8587 · FAX 031)982-8587</p>
    <p class="fine" data-i18n="footer.fineContact">본 사이트는 포트폴리오용 가상 회사 예시입니다. 문의는 이 브라우저에만 저장됩니다.</p>
  </footer>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
